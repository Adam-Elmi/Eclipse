# ###################
# The wallpaper: Eclipse's own (theme/wallpaper.png, installed at ~/.config/eclipse/), on every
# screen, filling it. No splash text; ipc on so it can be changed without a restart
# ###################

splash = 0
ipc = 1

wallpaper {
    monitor =
    path = ~/.config/eclipse/wallpaper.png
    fit_mode = cover
}
