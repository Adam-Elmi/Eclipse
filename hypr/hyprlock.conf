# ###################
# The Eclipse lock screen: the wallpaper, darkened and softened; the time large in the middle
# with a rose glow, the date under it, a password field with a rose → plum edge (green while
# checking, red if wrong), and the
# keyboard layout (click to switch). Colors from eclipse-colors.conf
# ###################

source = ~/.config/hypr/eclipse-colors.conf

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = calm, 0.25, 1, 0.3, 1
    animation = fadeIn, 1, 4, calm
    animation = fadeOut, 1, 4, calm
    animation = inputFieldDots, 1, 2, calm
}

background {
    monitor =
    path = ~/.config/eclipse/wallpaper.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
}

label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font
    color = $ink
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(f06595aa)
    shadow_boost = 1.2
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 18
    font_family = $font
    color = $muted
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    rounding = 12
    inner_color = rgba(1c1924e6)
    outer_color = $accent $plum 45deg
    check_color = $ok
    fail_color = $error
    font_color = $ink
    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[EN,AR]
    font_size = 13
    font_family = $mono
    color = $faint
    onclick = hyprctl switchxkblayout all next
    position = 0, -100
    halign = center
    valign = center
}
